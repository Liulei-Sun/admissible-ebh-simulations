name: Verify simulation packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Tests, checksums, stored metrics, and manuscript tables
        run: python -B scripts/verify_all.py --structural-only
      - name: Independently recertify all stored learned sets on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: python -B closed_eBH_asymmetric_weights_variance010_R1000/code/verify_package.py closed_eBH_asymmetric_weights_variance010_R1000
